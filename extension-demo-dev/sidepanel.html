<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 12px; background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 95vh; box-sizing: border-box; }
    h3 { margin: 0 0 10px; font-size: 14px; color: #38bdf8; border-bottom: 1px solid #334155; padding-bottom: 8px; }
    #chat-box { flex: 1; overflow-y: auto; background: #1e293b; border-radius: 8px; padding: 10px; margin-bottom: 10px; border: 1px solid #334155; display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
    .msg { padding: 8px 12px; border-radius: 6px; line-height: 1.4; white-space: pre-wrap; }
    .user { background: #2563eb; color: white; align-self: flex-end; max-width: 85%; }
    .ai { background: #334155; color: #f8fafc; align-self: flex-start; max-width: 90%; }
    .controls { display: flex; flex-direction: column; gap: 6px; }
    textarea { width: 100%; padding: 8px; background: #1e293b; border: 1px solid #475569; border-radius: 6px; color: white; font-size: 12px; box-sizing: border-box; resize: none; }
    .btn-group { display: flex; gap: 6px; }
    button { flex: 1; padding: 8px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px; }
    .btn-send { background: #2563eb; color: white; }
    .btn-save { background: #16a34a; color: white; }
  </style>
</head>
<body>
  <h3>💬 AI Research Copilot</h3>
  <div id="chat-box">
    <div class="msg ai">Hello! Select text on any page and right-click "Send Selection to AI Chat", or ask me to analyze this tab.</div>
  </div>

  <div class="controls">
    <textarea id="userInput" rows="2" placeholder="Ask a question or say 'Save this to dashboard with tag Security'"></textarea>
    <div class="btn-group">
      <button id="sendBtn" class="btn-send">Send</button>
      <button id="saveBtn" class="btn-save">📌 Save Last AI Response</button>
    </div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
