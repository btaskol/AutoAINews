<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News Aggregator with AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>📰 News Aggregator</h1>
      <p>Personalized news with AI summaries & Q&A</p>
    </header>

    <div id="error" class="error" style="display: none;"></div>
    
    <!-- Feed Management Section -->
    <div class="feed-manager">
      <div class="feed-input-group">
        <input 
          type="url" 
          id="feedInput" 
          placeholder="Enter RSS feed URL or website URL" 
          class="feed-input"
        >
        <button id="addFeedBtn" class="btn btn-success">Add Feed</button>
      </div>

      <div class="feeds-list">
        <h3>Your Feeds (Check boxes to select which feeds to load):</h3>
        <div id="feedsList" class="feeds-container"></div>
      </div>
    </div>

    <!-- Articles Loading Section -->
    <div class="controls">
      <button id="loadBtn" class="btn btn-primary">Load Articles from Selected</button>
      <span id="status" class="status"></span>
    </div>

    <div id="articles" class="articles"></div>
    <div id="loading" class="loading" style="display: none;">Loading articles...</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
